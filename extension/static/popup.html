<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LocaLeaf</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/localeaf.svg" alt="" class="logo">
  <h1>LocaLeaf</h1>
  <span id="engine" class="pill" title="TeX engine">engine</span>
  <button type="button" id="restart" class="icon" title="Restart the TeX engine" aria-label="Restart the TeX engine" hidden>↻</button>
</header>
<main>
  <section id="site" class="card"></section>
  <section id="project" class="card" hidden></section>
  <section id="stats" class="card" hidden></section>
  <section id="settings" class="card">
    <h2>Settings</h2>
    <div id="groups"></div>
    <p class="actions"><button type="button" id="reset" class="link">Reset all settings</button></p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
